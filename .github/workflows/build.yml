name: Build MechForce

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    name: Rules test + web/server build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - name: Version tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v$v" ]; then echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version $v. Bump the version, commit, then tag v$v."; exit 1; fi
      - run: npm test
      - run: npm run build
      - name: Package web + dedicated server
        run: |
          mkdir -p out/MechForce-Server
          cp -r dist/web out/MechForce-Server/web
          cp dist/server.cjs out/MechForce-Server/
          printf 'Run: node server.cjs --port 7373\nThen open http://<this-machine-ip>:7373 in any browser, or use Join Game in the apps.\n' > out/MechForce-Server/README.txt
          cd out && zip -qr MechForce-Server-and-Web.zip MechForce-Server
          cp ../dist/artifact/mechforce.html MechForce-Browser.html
      - name: Prepare GitHub Pages site
        run: |
          mkdir -p pages && cp dist/web/index.html pages/index.html && touch pages/.nojekyll
          cp pages/index.html pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-Web-and-Server
          path: |
            out/MechForce-Server-and-Web.zip
            out/MechForce-Browser.html

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run dist:win
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-Windows
          path: release/*.exe

  linux:
    name: Steam Deck / Linux (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run dist:linux
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-SteamDeck-Linux
          path: |
            release/*.AppImage
            release/*.tar.gz

  android:
    name: Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v5
        # cache Gradle's downloads: fetching every library from Maven Central on every run
        # gets rate-limited ("429 Too Many Requests") and fails the build
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleRelease
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > gradle.log 2>&1
          code=$?
          # a rate limit or network blip from a package server is worth one more go
          if [ $code -ne 0 ] && grep -qE "status code (429|5[0-9][0-9])|Connection reset|timed out" gradle.log; then
            echo "::warning::Package download failed (rate limit or network); retrying once in 60s"
            sleep 60
            ./gradlew assembleRelease --no-daemon --stacktrace > gradle.log 2>&1
            code=$?
          fi
          tail -n 80 gradle.log
          if [ $code -ne 0 ]; then grep -E "error|What went wrong|FAILURE|Exception" gradle.log | head -n 15 | while read -r l; do echo "::error::$l"; done; exit $code; fi
          set -e
          cp app/build/outputs/apk/release/app-release.apk ../MechForce-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-Android
          path: MechForce-Android.apk

  screenshots:
    # Plays a few battles in a headless browser and photographs them, so visual changes in a
    # pull request can be looked at before merging (download "MechForce-Screenshots" from the
    # run's page)
    name: Screenshots
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Battles on every map type
        run: node test/look.cjs
        env: { SHOT: shots, WAIT: '6000' }
      - name: Mech close-ups and VR (emulated Quest 3)
        run: |
          for t in temperate volcanic snow; do node test/look-mechs.cjs $t; done
          node test/vr.cjs
          QUALITY=low SHOT=shots/low THEMES=temperate,volcanic WAIT=5000 node test/look.cjs
        env: { SHOT: shots }
      - uses: actions/upload-artifact@v4
        with: { name: MechForce-Screenshots, path: shots, retention-days: 14 }
      - name: Summary
        run: echo "Screenshots of $(ls shots/*.png shots/low/*.png | wc -l) views are in the MechForce-Screenshots artifact above." >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Publish web version (GitHub Pages)
    # The web version updates with releases, not every push: web players crossplay with the
    # released desktop and Android builds, so they should run the same version
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: [web, release]
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/configure-pages@v5
        with: { enablement: true }
        continue-on-error: true
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish release
    # Releases only come from version tags (git tag v1.17.0 && git push origin v1.17.0).
    # Pushes to main still build and test everything; the builds are on the run's page.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: [web, windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MechForce ${{ github.ref_name }}
          make_latest: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/*.html
          body: |
            **Downloads**
            - **Windows:** `MechForce-…-Windows-Setup.exe` (installer) or `…-Portable.exe`
            - **Steam Deck / Linux:** `MechForce-…-Linux-SteamDeck.AppImage` — see README for adding it to Steam
            - **Android:** `MechForce-Android.apk` (sideload)
            - **Browser / dedicated server:** `MechForce-Server-and-Web.zip`, or `MechForce-Browser.html` for offline single player

            **Play in your browser:** https://somethingthatdoesntdoxme.github.io/MechForce/

            All versions crossplay. **Host Online** on any version (web included) gives a code friends enter in Join Game, or an invite link. Windows / Steam Deck can also **Host LAN Server**.
